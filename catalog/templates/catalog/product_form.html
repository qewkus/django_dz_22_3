{% extends 'base.html' %}
{% load static %}

{% block content %}

  <form method="post" action="">
    {% for field in form %}
      <p>
        {% if field.name == "published" and not perms.catalog.can_unpublish_product %}

          {% else %}
          {{ field.label_tag }}
          {{ field }}
        {% endif %}
      </p>
    {% endfor %}
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </form>


{% endblock %}
